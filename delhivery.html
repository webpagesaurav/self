<input
    type="tel"
    id="phone"
    placeholder="Enter 10-digit WhatsApp number"
    maxlength="10"
    inputmode="numeric"
    oninput="myFunction()"
>

<button type="button" onclick="myFunction()">Open WhatsApp</button>

<script>
function myFunction() {
    const input = document.getElementById("phone");
    const value = input.value.replace(/\D/g, "");

    // Keep only numbers
    input.value = value;

    // Auto-open when exactly 10 digits are entered
    if (value.length === 10) {
        const message = encodeURIComponent(`📦 Sir/Madam, आपका पार्सल लेकर आया हूँ। 

delhivery_office
https://maps.app.goo.gl/Z8ggV2DGEd2fEBwx5
`);
        window.open(`https://wa.me/91${value}?text=${message}`, "_blank");
    }
}
</script>
